version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: ["start-dev", "--http-enabled=true", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: dataspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2023-05-25T00-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data

  openmetadata:
    image: openmetadata/openmetadata:latest
    environment:
      - OM_KEY=local
      - DATABASE_HOST=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_USERNAME=postgres
      - DATABASE_DBNAME=dataspace
    ports:
      - "8585:8585"

volumes:
  pgdata:
  miniodata: