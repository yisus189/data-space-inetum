name: Bootstrap Data Space Inetum

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create minimal files
        run: |
          set -e
          mkdir -p connectors/ids_connector_mock scripts config policies examples tests .github/workflows

          cat > README.md <<'EOF'
Data Space Inetum — IDSA + DSSC compliant (plantilla)

Quick start (local)
1. cp scripts/config.example.env .env
2. docker-compose up -d
EOF

          cat > .gitignore <<'EOF'
__pycache__/
.env
*.pyc
.vscode/
.idea/
examples/catalog_ids.json
.secrets/
EOF

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bootstrap minimal — test YAML"
          git push origin HEAD:main
