#!/usr/bin/env python3
"""
Herramientas para generar JWT de prueba (no recomendado para producción).
Uso:
  python3 scripts/jwt_tools.py gen --kid testkey --subject user1 --out jwt.txt
"""
import argparse
import time
import jwt

DEFAULT_PRIVATE_KEY = "scripts/test_private.pem"

def load_private_key(path=DEFAULT_PRIVATE_KEY):
    with open(path, "rb") as f:
        return f.read()

def gen_jwt(kid="testkey", subject="test-user", aud="ids-connector", exp_minutes=60, private_key_path=None):
    key = load_private_key(private_key_path or DEFAULT_PRIVATE_KEY)
    now = int(time.time())
    payload = {
        "iss": "http://localhost:8180/realms/dataplane",
        "sub": subject,
        "aud": aud,
        "iat": now,
        "exp": now + exp_minutes * 60,
        "scope": "ids:access"
    }
    headers = {"kid": kid}
    token = jwt.encode(payload, key, algorithm="RS256", headers=headers)
    return token

def main():
    parser = argparse.ArgumentParser()
    sub = parser.add_subparsers(dest="cmd")
    gen = sub.add_parser("gen")
    gen.add_argument("--kid", default="testkey")
    gen.add_argument("--subject", default="test-user")
    gen.add_argument("--aud", default="ids-connector")
    gen.add_argument("--exp", type=int, default=60)
    gen.add_argument("--private", default=None)
    gen.add_argument("--out", default="jwt.txt")
    args = parser.parse_args()
    if args.cmd == "gen":
        token = gen_jwt(kid=args.kid, subject=args.subject, aud=args.aud, exp_minutes=args.exp, private_key_path=args.private)
        with open(args.out, "w") as f:
            f.write(token)
        print("JWT generado en", args.out)

if __name__ == "__main__":
    main()
EOF
