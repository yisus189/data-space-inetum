name: Bootstrap Data Space Inetum

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create project files
        run: |
          set -e
          mkdir -p connectors/ids_connector_mock scripts config policies examples tests .github/workflows

          cat > README.md <<'EOF'
Data Space Inetum — IDSA + DSSC compliant (plantilla)

Este repositorio contiene una plantilla completa para desplegar un Data Space de prueba/POC orientado a empresa,
compatible con los principios IDSA y con recomendaciones del DSSC. Incluye:

- OpenMetadata (catálogo) + script que extrae el catálogo y lo transforma a DCAT/JSON-LD compatible.
- Keycloak como DAPS emulado (emite JWTs).
- Conector IDS mock (Flask) que valida JWTs.
- Scripts para generar/validar JWTs de prueba.
- Políticas/contratos de ejemplo (ODRL/DPL JSON-LD).
- Docker Compose para "one-click" local.
- Tests unitarios y CI básica (GitHub Actions).

Licencia: Apache-2.0

Quick start (local)
1. Copia config: cp scripts/config.example.env .env
2. Rellena variables en .env si es necesario (ej. CLIENT_SECRET).
3. Levanta la pila:
   docker-compose up -d
4. Espera a que Keycloak/OpenMetadata estén arriba (logs).
5. Ejecuta:
   bash scripts/setup_keycloak_realm.sh
6. Inserta dataset de ejemplo en OpenMetadata (script incluido).
7. Extrae catálogo:
   python3 scripts/openmetadata_ingest.py --url http://localhost:8585 --api_key "" --out examples/catalog_ids.json
8. Genera un JWT de prueba:
   python3 scripts/jwt_tools.py gen --kid testkey --subject test-user --out jwt.txt
9. Llama al conector:
   curl -H "Authorization: Bearer $(cat jwt.txt)" http://localhost:8000/api/offers
EOF

