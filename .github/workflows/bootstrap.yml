#!/usr/bin/env python3
from flask import Flask, request, jsonify
import os
import requests
from jose import jwt, JWTError
from cachetools import TTLCache

KEYCLOAK_URL = os.environ.get("KEYCLOAK_URL", "http://keycloak:8080")
REALM = os.environ.get("KEYCLOAK_REALM", "dataplane")
JWKS_URL = f"{KEYCLOAK_URL}/realms/{REALM}/protocol/openid-connect/certs"

app = Flask(__name__)
jwks_cache = TTLCache(maxsize=1, ttl=300)

def get_jwks():
    if 'jwks' in jwks_cache:
        return jwks_cache['jwks']
    r = requests.get(JWKS_URL, timeout=5)
    r.raise_for_status()
    jwks = r.json()
    jwks_cache['jwks'] = jwks
    return jwks

def validate_jwt(token):
    jwks = get_jwks()
    try:
        headers = jwt.get_unverified_header(token)
        kid = headers.get('kid')
        keys = jwks.get('keys', [])
        key = None
        for k in keys:
            if k.get('kid') == kid:
                key = k
                break
        if not key:
            raise Exception("kid not found in jwks")
        claims = jwt.decode(token, key, algorithms=['RS256'], audience="ids-connector")
        return claims
    except JWTError as e:
        raise

def require_jwt():
    auth = request.headers.get("Authorization", "")
    if not auth.startswith("Bearer "):
        return None, (jsonify({"error": "missing token"}), 401)
    token = auth.split(" ", 1)[1]
    try:
        claims = validate_jwt(token)
        return claims, None
    except Exception as e:
        return None, (jsonify({"error": "invalid token", "detail": str(e)}), 401)

@app.route("/api/offers", methods=["GET"])
def offers():
    claims, err = require_jwt()
    if err:
      return err
    return jsonify({
      "offers": [
        {"id": "offer-1", "dataset": "sample-dataset", "price": 0, "policy": "policies/data-usage-policy.jsonld"}
      ],
      "subject": claims.get("sub")
    })

@app.route("/api/contract", methods=["POST"])
def contract():
    claims, err = require_jwt()
    if err:
      return err
    payload = request.json or {}
    print("Contrato recibido:", payload)
    return jsonify({"status": "accepted", "contractId": "ct-123", "subject": claims.get("sub")})

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=8000)
EOF

