#!/usr/bin/env python3
"""
Extrae tablas/datasets de OpenMetadata y genera un catálogo DCAT/JSON-LD.
Uso:
    python3 scripts/openmetadata_ingest.py --url http://localhost:8585 --api_key "" --out examples/catalog_ids.json
"""

import argparse
import json
import os
import requests

DEFAULT_TIMEOUT = 10

def fetch_tables(base_url, api_key, limit=100):
    headers = {}
    if api_key:
        headers['Authorization'] = f'Bearer {api_key}'
    url = f"{base_url.rstrip('/')}/api/v1/tables?limit={limit}"
    items = []
    resp = requests.get(url, headers=headers, timeout=DEFAULT_TIMEOUT)
    resp.raise_for_status()
    data = resp.json()
    if isinstance(data, dict):
        if 'data' in data and isinstance(data['data'], dict):
            if 'tables' in data['data']:
                items = data['data']['tables']
        elif 'entities' in data:
            items = data['entities']
        else:
            for v in data.values():
                if isinstance(v, list):
                    items = v
                    break
    elif isinstance(data, list):
        items = data
    return items

def map_to_dcat(entity):
    name = entity.get("fullyQualifiedName") or entity.get("name") or entity.get("id")
    title = entity.get("displayName") or name
    description = entity.get("description") or ""
    owner = entity.get("owner") or {}
    tags = [t.get('tagFQN') if isinstance(t, dict) else t for t in (entity.get('tags') or [])]
    href = entity.get('href') or entity.get('href')
    return {
        "@type": "dcat:Dataset",
        "id": name,
        "title": title,
        "description": description,
        "publisher": {"name": owner.get('name') if owner else None},
        "distributions": [
            {"accessURL": href, "format": entity.get("tableType") or "unknown"}
        ],
        "keywords": tags
    }

def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--url", required=True, help="OpenMetadata base URL")
    parser.add_argument("--api_key", default="", help="API key (si aplica)")
    parser.add_argument("--out", default="examples/catalog_ids.json", help="Archivo de salida")
    args = parser.parse_args()

    items = fetch_tables(args.url, args.api_key)
    dcat_items = [map_to_dcat(e) for e in items]
    catalog = {
        "@context": {"dcat": "http://www.w3.org/ns/dcat#"},
        "datasets": dcat_items
    }
    os.makedirs(os.path.dirname(args.out) or ".", exist_ok=True)
    with open(args.out, "w", encoding="utf-8") as f:
        json.dump(catalog, f, indent=2, ensure_ascii=False)
    print(f"Catalogo generado en {args.out}, elementos: {len(dcat_items)}")

if __name__ == "__main__":
    main()
EOF
