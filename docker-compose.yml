version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dataspace
      POSTGRES_USER: dataspace_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/postgresql/data
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://dataspace_user:changeme@db:5432/dataspace
      OPENMETADATA_URL: ${OPENMETADATA_URL:-}
      OPENMETADATA_API_KEY: ${OPENMETADATA_API_KEY:-}
    depends_on:
      - db
volumes:
  db-data: