version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: dataspace-db
    environment:
      POSTGRES_DB: dataspace
      POSTGRES_USER: dataspace_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataspace_user -d dataspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak for Authentication
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: dataspace-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: kc-admin
      KEYCLOAK_ADMIN_PASSWORD: changeMeAdmin123!
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/dataspace
      KC_DB_USERNAME: dataspace_user
      KC_DB_PASSWORD: changeme
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: dataspace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenMetadata Database
  openmetadata-db:
    image: postgres:15
    container_name: dataspace-openmetadata-db
    environment:
      POSTGRES_DB: openmetadata_db
      POSTGRES_USER: openmetadata_user
      POSTGRES_PASSWORD: openmetadata_password
    volumes:
      - openmetadata-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata_user -d openmetadata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenMetadata Server
  openmetadata:
    image: openmetadata/server:1.3.0
    container_name: dataspace-openmetadata
    environment:
      OPENMETADATA_CLUSTER_NAME: openmetadata
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: openmetadata-db
      DB_PORT: 5432
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      DB_DATABASE: openmetadata_db
      AUTHENTICATION_PROVIDER: no-auth
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.NoopAuthorizer
      ELASTICSEARCH_SOCKET_TIMEOUT_SECS: 60
      ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: 60
      ELASTICSEARCH_BATCH_SIZE: 10
    ports:
      - "8585:8585"
    depends_on:
      openmetadata-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  # Database Migrations
  migrations:
    build: .
    container_name: dataspace-migrations
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://dataspace_user:changeme@db:5432/dataspace
    depends_on:
      db:
        condition: service_healthy

  # Data Space API
  api:
    build: .
    container_name: dataspace-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://dataspace_user:changeme@db:5432/dataspace
      OPENMETADATA_URL: http://openmetadata:8585
      OPENMETADATA_API_KEY: ${OPENMETADATA_API_KEY:-}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: dataspace
      KEYCLOAK_CLIENT_ID: dataspace-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dataspace-secret}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_password
      MINIO_SECURE: "false"
      MINIO_BUCKET: dataspace-transfers
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      openmetadata:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  minio-data:
  openmetadata-db-data: